name: Build and validate Android test APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: stridelab-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install required Android SDK packages using runner SDK
        shell: bash
        run: |
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$sdk"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$manager" || { echo "SDK manager missing at $manager"; ls -la "$sdk/cmdline-tools"; exit 1; }
          "$manager" --sdk_root="$sdk" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: python -m pip install fitdecode==0.11.0 lxml==6.0.2
      - run: node tests/core.test.js
      - run: python tests/session_formats_test.py
      - run: python skills/synthetic-running-data/scripts/test_skill.py
      - name: Compile APK with bounded retry for repository rate limiting
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if gradle --no-daemon --max-workers=2 :app:assembleDebug 2>&1 | tee /tmp/stridelab-build.log; then
              exit 0
            fi
            if ! grep -Eq '429|Too Many Requests|Read timed out|Connection reset' /tmp/stridelab-build.log; then
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then sleep "$((attempt*60))"; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: StrideLab-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - run: gradle --no-daemon :app:lintDebug
      - run: python -m pip install playwright==1.51.0 && python -m playwright install --with-deps chromium
        if: success() || failure()
      - run: python tests/android_assets_test.py
        if: success() || failure()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-and-lint-evidence
          path: |
            test-evidence/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
  emulator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: StrideLab-debug-apk
          path: apk
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch and inspect Android UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash tests/android_emulator_smoke.sh apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-runtime-evidence
          path: test-evidence/
          if-no-files-found: warn
